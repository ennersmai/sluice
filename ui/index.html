<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sluice</title>
<style>
:root{
  --bg:#0c0f13;--surface:#13181f;--surface2:#1a212a;--line:#242c37;--line2:#323c4a;
  --fg:#d9e0e8;--dim:#8794a4;--faint:#5c6877;
  --ok:#3ecf7a;--cooling:#e6a935;--bad:#ef5b53;--paused:#7a8594;--missing:#b47ae6;--info:#5aa2f0;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--r:6px;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.st-ok{--c:var(--ok)}.st-cooling{--c:var(--cooling)}.st-breaker_open,.st-key_disabled{--c:var(--bad)}
.st-paused{--c:var(--paused)}.st-missing{--c:var(--missing)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s5);background:rgba(19,24,31,.96);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;letter-spacing:.3px;font-weight:650}
.ver{color:var(--faint);font-family:var(--mono);font-size:11px}
.hstat{color:var(--dim);font-size:12px}
.hstat b{color:var(--fg);font-weight:500}
#conn{margin-left:auto;display:flex;align-items:center;gap:var(--s2);color:var(--dim);font-size:12px}
#conn i{width:8px;height:8px;border-radius:50%;background:var(--paused)}
#conn.up i{background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,122,.18)}
#conn.down i{background:var(--bad);animation:pulse 1s ease-in-out infinite}
main{padding:var(--s4) var(--s5) var(--s5);max-width:1600px;margin:0 auto}
h2{display:flex;align-items:center;gap:var(--s3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:var(--s5) 0 var(--s2)}
h2 .right{margin-left:auto;display:flex;gap:var(--s2);align-items:center;text-transform:none;letter-spacing:0;font-weight:400}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.mono{font-family:var(--mono);font-size:12px}
.num{text-align:right;white-space:nowrap}
button,input{font:inherit;color:var(--fg)}
button{background:var(--surface2);border:1px solid var(--line2);border-radius:4px;padding:3px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--info)}
button:disabled{opacity:.55;cursor:default}
button.on{background:#1d2b3c;border-color:var(--info);color:#fff}
input{background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:3px 8px;width:190px}
input:focus{outline:1px solid var(--info);border-color:var(--info)}
/* summary */
#tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--s3)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4)}
.tile .l{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.tile .v{font-size:22px;font-weight:600;line-height:1.25;margin-top:2px}
.tile .sub{color:var(--faint);font-size:11px;min-height:15px}
.tile.ok .v{color:var(--ok)}.tile.warn .v{color:var(--cooling)}.tile.bad .v{color:var(--bad)}
/* pills, chips, tags */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--c,var(--line2));color:var(--c,var(--dim));white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--dim))}
.tag{font-size:10px;padding:0 6px;border-radius:3px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
.tag.paid{color:var(--cooling);border-color:var(--cooling)}
.tag.next{color:var(--ok);border-color:var(--ok)}
.chip{display:inline-block;margin:1px 4px 1px 0;padding:0 8px;border-radius:9px;border:1px solid var(--line2);font-size:12px;white-space:nowrap}
.chip.fail{color:var(--bad);border-color:var(--bad)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.pending{color:var(--info);border-color:var(--info);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
/* pools */
#pools{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--s3)}
.pool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4)}
.pool .ph{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s2)}
.pool .pn{font-weight:600;font-size:14px}
.pool .pnext{margin-left:auto;font-size:11px;color:var(--dim)}
.route{display:flex;align-items:center;gap:var(--s2);padding:5px 0;border-top:1px solid var(--line)}
.route .ix{width:16px;color:var(--faint);font-size:11px;text-align:right}
.route .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px}
.route.next{background:linear-gradient(90deg,rgba(62,207,122,.09),transparent 70%)}
.route.off .rn{color:var(--dim)}
/* providers */
#providers{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:var(--s3)}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c,var(--line2));border-radius:var(--r);padding:var(--s3) var(--s4)}
.card .head{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.card .sw{width:10px;height:10px;border-radius:3px}
.card .name{font-weight:600;font-size:14px}
.card .head .pill{margin-left:auto}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2) var(--s4);margin-top:var(--s3)}
.bar .lbl{display:flex;justify-content:space-between;color:var(--dim);font-size:11px}
.bar .lbl b{color:var(--fg);font-weight:500}
.bar .track{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:3px}
.bar .fill{height:100%;width:0;background:var(--info);transition:width .3s}
.bar .fill.warn{background:var(--cooling)}.bar .fill.bad{background:var(--bad)}
.bar.nolim .track{display:none}
.stats{display:flex;align-items:flex-end;gap:var(--s4);margin-top:var(--s3);flex-wrap:wrap}
.stats .s .l{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.stats .s .v{font-size:14px;font-weight:550}
.spark{margin-left:auto;width:120px;height:30px}
.notes{margin-top:var(--s2)}
.note{font-size:12px;color:var(--cooling);word-break:break-word}
.note.p{color:var(--missing)}
.err{margin-top:var(--s2);font-size:12px;color:var(--bad);word-break:break-word}
.btns{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
.fb{font-size:12px;color:var(--dim)}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:5px var(--s2);border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
th.num,td.num{text-align:right}
.models{margin-top:var(--s2);font-size:12px}
.models td,.models th{padding:3px 6px}
/* live */
#live{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
#live tr.row{cursor:pointer}
#live tr.row:hover td{background:var(--surface2)}
#live tr.inflight td{background:#14202e}
#live tr.open td{background:var(--surface2)}
#live td.model{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--info);margin-right:6px;animation:pulse 1.1s ease-in-out infinite}
.s2{color:var(--ok)}.s4{color:var(--bad)}.s0{color:var(--info)}
tr.detail>td{padding:var(--s3) var(--s4) var(--s4);background:var(--bg)}
.dgrid{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);margin-bottom:var(--s3)}
.dgrid .l{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.dgrid .v{font-size:13px}
table.att{width:auto;min-width:520px}
.empty{padding:var(--s4);color:var(--dim)}
/* chart */
#chartbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4)}
#chartbox svg{width:100%;height:auto;display:block}
#legend{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);margin-top:var(--s2);color:var(--dim)}
#legend i,.tip i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.tip{position:absolute;pointer-events:none;z-index:4;background:#0a0d11;border:1px solid var(--line2);border-radius:var(--r);padding:var(--s2) var(--s3);font-size:12px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.tip .th{color:var(--dim);margin-bottom:3px}
.tip .tr{display:flex;gap:var(--s3);justify-content:space-between}
@media (max-width:1000px){main{padding:var(--s3)}header{padding:var(--s3)}#providers{grid-template-columns:1fr}.hide-s{display:none}}
</style>
</head>
<body>
<header>
<h1>sluice</h1>
<span class="ver" id="h-ver"></span>
<span class="hstat">up <b id="h-up">-</b></span>
<span class="hstat hide-s">active requests <b id="h-act">-</b></span>
<div id="conn"><i></i><span id="conn-t">connecting</span></div>
</header>
<main>
<div id="tiles"></div>
<h2>Pools <span class="faint">routes in failover order</span></h2>
<div id="pools"></div>
<h2>Live routing
<span class="right">
<span id="fbtns"></span>
<input id="fq" type="text" placeholder="filter model / provider" autocomplete="off" spellcheck="false">
<span class="faint" id="fcount"></span>
</span></h2>
<div id="live"><table id="ltable" hidden>
<thead><tr><th>time</th><th>model</th><th>attempts</th><th class="num">ttft</th><th class="num">in / out</th><th class="num">duration</th><th>status</th></tr></thead>
<tbody id="lbody"></tbody></table><div class="empty" id="lempty">No requests yet.</div></div>
<h2>Providers</h2>
<div id="providers"></div>
<h2>Tokens per hour, last 24 h <span class="faint" id="chartnote"></span></h2>
<div id="chartbox"><div id="chart"></div><div id="legend"></div><div class="tip" id="tip" hidden></div></div>
</main>
<script>
'use strict';
var SVGNS = 'http:' + '//www.w3.org/2000/svg';
var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
function sv(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function add(parent) {
  for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
  return parent;
}
function fmtN(n) {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k';
  return String(Math.round(n));
}
function fmtMs(ms) {
  if (ms === null || ms === undefined) return '-';
  return ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + ' s';
}
function fmtDur(s) {
  s = Math.max(0, Math.floor(s));
  var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return d + 'd ' + h + 'h';
  if (h) return h + 'h ' + m + 'm';
  if (m) return m + 'm ' + (s % 60) + 's';
  return s + 's';
}
function fmtCd(ms) {
  var s = Math.ceil(ms / 1000);
  if (s <= 0) return '0s';
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
  return Math.floor(s / 3600) + 'h ' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + 'm';
}
function pad2(n) { return String(n).padStart(2, '0'); }
function fmtClock(ms) { var d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }
function fmtFull(ms) { return new Date(ms).toLocaleString(); }
function fmtAgo(ms) {
  var s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  if (s < 5) return 'just now';
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm ago';
  return Math.floor(s / 86400) + 'd ago';
}
function fmtUsd(v) { return '$' + (Number(v) || 0).toFixed(2); }
function stateLabel(s) { return String(s).replace('_', ' '); }

var S = null;            // last /status snapshot, merged with counters events
var statusAt = 0;        // performance.now() when S.uptime_secs was current
var recent = [];         // request records, newest first
var byId = {};
var colors = ['#6ea8fe', '#4dd0c4', '#f28fad', '#d6b94f', '#9b8cf0', '#7fc97f', '#e0916a', '#8fb4c9'];
var colorOf = {};
var lastEventAt = 0;
var connected = false;

// ---- tickers: spans carry absolute deadlines / timestamps ----
function cdSpan() { var s = el('span', 'cd'); s.hidden = true; return s; }
function setCd(s, until) {
  if (typeof until === 'number') { s.dataset.until = String(until); s.hidden = false; s.textContent = fmtCd(until - performance.now()); }
  else s.hidden = true;
}
function agoSpan(ms) { var s = el('span', 'ago'); s.dataset.ts = String(ms); s.textContent = fmtAgo(ms); return s; }
function tickSlow() {
  var now = performance.now(), i, list = document.querySelectorAll('.cd');
  for (i = 0; i < list.length; i++) if (!list[i].hidden) list[i].textContent = fmtCd(Number(list[i].dataset.until) - now);
  list = document.querySelectorAll('.ago');
  for (i = 0; i < list.length; i++) list[i].textContent = fmtAgo(Number(list[i].dataset.ts));
  if (S) $('h-up').textContent = fmtDur(S.uptime_secs + (now - statusAt) / 1000);
  if (connected && Date.now() - lastEventAt > 7000) setConn(false);   // counters arrive every 2 s
}
function tickFast() {
  var list = document.querySelectorAll('.el'), now = Date.now();
  for (var i = 0; i < list.length; i++) list[i].textContent = fmtMs(Math.max(0, now - Number(list[i].dataset.start)));
}
function stamp(p, t) { p._until = typeof p.expires_in_ms === 'number' ? t + p.expires_in_ms : null; }
function stampAll(p, t) {
  stamp(p, t);
  (p.cooldowns || []).forEach(function (c) { stamp(c, t); });
  (p.models || []).forEach(function (m) { stamp(m, t); });
}

// ---- pills ----
function mkPill() {
  var p = el('span', 'pill');
  p.lab = document.createTextNode('');
  p.cd = cdSpan();
  add(p, p.lab, p.cd);
  return p;
}
function setPill(p, state, until) {
  p.className = 'pill st-' + state;
  p.lab.nodeValue = stateLabel(state);
  setCd(p.cd, state === 'cooling' || state === 'breaker_open' ? until : null);
}
function lastErrText(e) { return e.reason + (e.model ? ' (' + e.model + ')' : ''); }

// ---- summary ----
var tiles = {};
function mkTiles() {
  var box = $('tiles');
  [['req', 'requests today'], ['in', 'tokens in today'], ['out', 'tokens out today'], ['streams', 'active streams'],
   ['succ', 'success, last 200'], ['fo', 'failovers, last 200'], ['paid', 'paid spend / cap']].forEach(function (t) {
    var d = el('div', 'tile'), v = el('div', 'v', '-'), sub = el('div', 'sub');
    add(d, el('div', 'l', t[1]), v, sub);
    box.appendChild(d);
    tiles[t[0]] = { d: d, v: v, sub: sub };
  });
}
function setTile(k, v, sub, cls) {
  var t = tiles[k];
  t.v.textContent = v;
  t.sub.textContent = sub || '';
  t.d.className = 'tile' + (cls ? ' ' + cls : '');
}
function renderSummary() {
  if (!S) return;
  var done = recent.filter(function (r) { return !r.in_flight && r.status !== 499; });
  var okc = done.filter(function (r) { return r.status >= 200 && r.status < 400; }).length;
  var fo = recent.filter(function (r) { return r.attempts.length > 1; }).length;
  var pd = S.paid || {};
  var pct = done.length ? okc / done.length * 100 : null;
  setTile('req', fmtN(S.requests_today), S.active_requests + ' in flight');
  setTile('in', fmtN(S.tokens_in_today));
  setTile('out', fmtN(S.tokens_out_today));
  setTile('streams', S.active_streams);
  setTile('succ', pct === null ? '-' : pct.toFixed(pct === 100 ? 0 : 1) + '%', okc + ' of ' + done.length,
    pct === null ? '' : pct >= 95 ? 'ok' : pct >= 80 ? 'warn' : 'bad');
  setTile('fo', fo, recent.length ? Math.round(fo / recent.length * 100) + '% of requests' : '');
  var cap = Number(pd.cap_usd) || 0, sp = Number(pd.spend_usd) || 0;
  setTile('paid', fmtUsd(sp) + ' / ' + fmtUsd(cap), cap ? Math.round(sp / cap * 100) + '% of cap' : 'paid routes off',
    cap && sp >= cap ? 'bad' : cap && sp >= cap * 0.8 ? 'warn' : '');
  $('h-act').textContent = String(S.active_requests);
  $('h-up').textContent = fmtDur(S.uptime_secs + (performance.now() - statusAt) / 1000);
  if (S.version) $('h-ver').textContent = 'v' + S.version;
}

// ---- pools ----
var poolKey = '', poolRefs = [];
function findProv(id) {
  if (!S) return null;
  for (var i = 0; i < S.providers.length; i++) if (S.providers[i].id === id) return S.providers[i];
  return null;
}
function routeState(spec) {
  var i = spec.indexOf('/'), pid = spec.slice(0, i), model = spec.slice(i + 1), p = findProv(pid);
  if (!p) return { s: 'missing', note: 'unknown provider' };
  if (p.state === 'paused') return { s: 'paused', note: 'provider paused' };
  if (p.state === 'key_disabled') return { s: 'key_disabled', note: 'all keys disabled' };
  if (p.state === 'breaker_open') return { s: 'breaker_open', until: p._until, note: 'breaker open' };
  var m = (p.models || []).filter(function (x) { return x.model === model; })[0];
  if ((p.missing_models || []).indexOf(model) >= 0 || (m && m.state === 'missing')) return { s: 'missing', note: 'model not offered' };
  if (m && m.state === 'cooling') return { s: 'cooling', until: m._until, note: 'route cooling' };
  if (p.state === 'cooling') return { s: 'cooling', until: p._until, note: 'provider cooling' };
  return { s: 'ok', note: p.paid ? 'paid route' : '' };
}
function renderPools() {
  if (!S) return;
  var pools = S.pools || [], key = JSON.stringify(pools);
  var box = $('pools');
  if (key !== poolKey) {
    poolKey = key;
    box.textContent = '';
    poolRefs = pools.map(function (pl) {
      var d = el('div', 'pool'), h = el('div', 'ph'), nx = el('span', 'pnext');
      add(h, el('span', 'pn', pl.name), el('span', 'tag', pl.routes.length + (pl.routes.length === 1 ? ' route' : ' routes')), nx);
      d.appendChild(h);
      var rows = pl.routes.map(function (spec, i) {
        var r = el('div', 'route'), nm = el('span', 'rn', spec), pill = mkPill(), tg = el('span', 'tag next', 'next');
        nm.title = spec;
        add(r, el('span', 'ix', i + 1), nm, tg, pill);
        d.appendChild(r);
        return { r: r, tg: tg, pill: pill, spec: spec };
      });
      box.appendChild(d);
      return { nx: nx, rows: rows };
    });
    if (!pools.length) box.appendChild(el('div', 'dim', 'No pools configured.'));
  }
  poolRefs.forEach(function (pr) {
    var first = -1;
    pr.rows.forEach(function (row, i) {
      var st = routeState(row.spec);
      if (st.s === 'ok' && first < 0) first = i;
      setPill(row.pill, st.s, st.until);
      row.r.title = st.note || '';
      row.r.classList.toggle('off', st.s !== 'ok');
    });
    pr.rows.forEach(function (row, i) {
      row.r.classList.toggle('next', i === first);
      row.tg.hidden = i !== first;
    });
    pr.nx.textContent = first >= 0 ? 'next: ' + pr.rows[first].spec : 'no route available';
    pr.nx.style.color = first >= 0 ? '' : 'var(--bad)';
  });
}

// ---- provider cards (built once, updated in place) ----
var cards = {};
var BARS = [['rpm', 'requests_minute', 'req / min'], ['rpd', 'requests_day', 'req / day'],
            ['tpm', 'tokens_minute', 'tokens / min'], ['tpd', 'tokens_day', 'tokens / day']];
function mkBar(label) {
  var b = el('div', 'bar'), l = el('div', 'lbl'), t = el('div', 'track'), f = el('div', 'fill');
  b.val = el('b');
  add(l, el('span', null, label), b.val);
  b.fill = f;
  add(t, f);
  return add(b, l, t);
}
function setBar(b, used, limit) {
  used = Number(used) || 0;

    renderPools();
    renderSummary();
  }
}
function setConn(up, text) {
  connected = up;
  $('conn').className = up ? 'up' : 'down';
  $('conn-t').textContent = text || (up ? 'connected' : 'reconnecting');
}
var es = null, backoff = 500;
function connect() {
  if (es) es.close();
  es = new EventSource('/events');
  ['request_start', 'attempt', 'first_byte', 'request_end', 'route_state', 'counters'].forEach(function (t) {
    es.addEventListener(t, function (ev) {
      var d;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      onEvent(t, d);
    });
  });
  es.onopen = function () {
    backoff = 500;
    lastEventAt = Date.now();
    setConn(true);
    fetchStatus(0);
  };
  es.onerror = function () {
    es.close();
    setConn(false);
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 10000);
  };
}
mkTiles();
mkFilters();
fetch('/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(applyStatus)
  .catch(function () { setConn(false, 'status unavailable'); })
  .then(connect);
setInterval(tickSlow, 1000);
setInterval(tickFast, 250);
setInterval(function () { fetchStatus(0); }, 30000);
</script>
