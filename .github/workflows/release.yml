name: Release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: sluice.exe
            asset: sluice-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: sluice
            asset: sluice-linux-x64-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (ring needs a C compiler for musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check size and stage asset
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          size=$(wc -c < "$src")
          echo "$src is $size bytes"
          if [ "$size" -gt 12582912 ]; then echo "binary is over 12 MB"; exit 1; fi
          mkdir -p dist
          cp "$src" "dist/${{ matrix.asset }}"
      - name: Create or update the release and attach the binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Both matrix jobs run this; whichever is second finds the release existing.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes || gh release view "$tag" >/dev/null
          gh release upload "$tag" "dist/${{ matrix.asset }}" --clobber
