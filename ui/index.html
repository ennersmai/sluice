<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sluice</title>
<style>
:root{--bg:#0f1216;--panel:#171b21;--panel2:#1e242c;--line:#2a323c;--fg:#d8dee6;--dim:#8a95a3;--ok:#3fb56b;--warn:#e0a52e;--bad:#e5534b;--info:#4c9be8;--paused:#7d8794}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 6px 0 0;letter-spacing:.5px}
.stat{display:flex;flex-direction:column}
.stat b{font-size:15px;font-weight:600}
.stat span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
#conn{margin-left:auto;color:var(--dim)}
main{padding:16px 20px;max-width:1500px;margin:0 auto}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:22px 0 8px}
#providers{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
.card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .name{font-weight:600;font-size:14px}
.tag{font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--dim)}
.tag.paid{color:var(--warn);border-color:var(--warn)}
.pill{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.cooling{color:var(--warn);border-color:var(--warn)}
.pill.breaker_open,.pill.key_disabled{color:var(--bad);border-color:var(--bad)}
.pill.paused,.pill.missing{color:var(--paused)}
.bar{margin:8px 0 0}
.bar .lbl{display:flex;justify-content:space-between;color:var(--dim);font-size:11px}
.bar .track{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:2px}
.bar .fill{height:100%;background:var(--info)}
.bar .fill.warn{background:var(--warn)}
.bar .fill.bad{background:var(--bad)}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;color:var(--dim)}
.kv b{color:var(--fg);font-weight:500}
.err{margin-top:8px;color:var(--bad);font-size:12px;word-break:break-word}
.note{margin-top:6px;color:var(--warn);font-size:12px}
.btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--info)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase}
.models{margin-top:8px;font-size:12px}
.models td,.models th{padding:3px 6px}
#live{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
.num{text-align:right;white-space:nowrap}
.chip{display:inline-block;margin:1px 4px 1px 0;padding:0 7px;border-radius:9px;border:1px solid var(--line);font-size:12px;white-space:nowrap}
.chip.fail{color:var(--bad);border-color:var(--bad)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.pending{color:var(--info);border-color:var(--info);animation:pulse 1.2s ease-in-out infinite}
tr.inflight td{background:#16222f}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--info);margin-right:6px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.dim{color:var(--dim)}
#chartbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
#chartbox svg{width:100%;height:auto;display:block}
#legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px}
#legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
</style>
</head>
<body>
<header>
<h1>sluice</h1>
<div class="stat"><b id="s-up">-</b><span>uptime</span></div>
<div class="stat"><b id="s-req">-</b><span>requests today</span></div>
<div class="stat"><b id="s-in">-</b><span>tokens in today</span></div>
<div class="stat"><b id="s-out">-</b><span>tokens out today</span></div>
<div class="stat"><b id="s-streams">-</b><span>active streams</span></div>
<div class="stat"><b id="s-paid">-</b><span>paid spend / cap</span></div>
<div id="conn">connecting...</div>
</header>
<main>
<h2>Providers</h2>
<div id="providers"></div>
<h2>Live routing</h2>
<div id="live"></div>
<h2>Tokens per hour, last 24 h</h2>
<div id="chartbox"><div id="chart"></div><div id="legend"></div></div>
</main>
<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
function add(parent) {
  for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
  return parent;
}
function fmtN(n) {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k';
  return String(Math.round(n));
}
function fmtMs(ms) {
  if (ms === null || ms === undefined) return '-';
  return ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + ' s';
}
function fmtDur(s) {
  s = Math.max(0, Math.floor(s));
  var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return d + 'd ' + h + 'h';
  if (h) return h + 'h ' + m + 'm';
  if (m) return m + 'm ' + (s % 60) + 's';
  return s + 's';
}
function fmtCd(ms) {
  var s = Math.ceil(ms / 1000);
  if (s <= 0) return '0s';
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
  return Math.floor(s / 3600) + 'h ' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + 'm';
}
function fmtClock(ms) { return new Date(ms).toTimeString().slice(0, 8); }
function fmtUsd(v) { return '$' + (Number(v) || 0).toFixed(2); }

var S = null;            // last /status snapshot, merged with counters events
var statusAt = 0;        // performance.now() when S.uptime_secs was current
var recent = [];         // request records, newest first
var byId = {};
var expanded = {};
var colors = ['#4c9be8', '#3fb56b', '#e0a52e', '#b172e0', '#e5534b', '#2fbfbf', '#e07fb0', '#9aa84a'];

// ---- countdowns: spans carry an absolute performance.now() deadline ----
function cd(until) {
  var s = el('span', 'cd');
  s.dataset.until = String(until);
  s.textContent = fmtCd(until - performance.now());
  return s;
}
function tickCountdowns() {
  var now = performance.now();
  var list = document.querySelectorAll('.cd');
  for (var i = 0; i < list.length; i++) {
    list[i].textContent = fmtCd(Number(list[i].dataset.until) - now);
  }
  if (S) $('s-up').textContent = fmtDur(S.uptime_secs + (now - statusAt) / 1000);
}
function stamp(p, t) {
  p._until = typeof p.expires_in_ms === 'number' ? t + p.expires_in_ms : null;
}
function stampAll(p, t) {
  stamp(p, t);
  (p.cooldowns || []).forEach(function (c) { stamp(c, t); });
  (p.models || []).forEach(function (m) { stamp(m, t); });
}

// ---- rendering ----
function bar(label, used, limit) {
  var b = el('div', 'bar');
  var l = el('div', 'lbl');
  add(l, el('span', null, label));
  if (limit) {
    add(l, el('span', null, fmtN(used) + ' / ' + fmtN(limit)));
    var t = el('div', 'track');
    var f = el('div', 'fill' + (used >= limit ? ' bad' : used >= limit * 0.8 ? ' warn' : ''));
    f.style.width = Math.min(100, used / limit * 100) + '%';
    add(t, f);
    return add(b, l, t);
  }
  add(l, el('span', null, fmtN(used) + ' (no limit set)'));
  return add(b, l);
}
function stateEl(state, until) {
  var p = el('span', 'pill ' + state, state.replace('_', ' '));
  if ((state === 'cooling' || state === 'breaker_open') && typeof until === 'number') {
    p.appendChild(document.createTextNode(' '));
    p.appendChild(cd(until));
  }
  return p;
}
function lastErr(e) {
  return e.reason + (e.model ? ' (' + e.model + ')' : '') + ' at ' + fmtClock(e.time_ms);
}
function card(p) {
  var c = el('div', 'card');
  var top = el('div', 'top');
  add(top, el('span', 'name', p.id));
  if (p.paid) add(top, el('span', 'tag paid', 'paid'));
  if (p.trains_on_input) add(top, el('span', 'tag', 'trains on input'));
  var kd = (p.disabled_keys || []).length;
  add(top, el('span', 'tag', p.keys + (p.keys === 1 ? ' key' : ' keys') + (kd ? ', ' + kd + ' disabled' : '')));
  add(top, stateEl(p.state, p._until));
  c.appendChild(top);
  var lim = p.limits || {};
  c.appendChild(bar('requests this minute', p.requests_minute, lim.rpm));
  c.appendChild(bar('requests today', p.requests_day, lim.rpd));
  if (lim.tpm) c.appendChild(bar('tokens this minute', p.tokens_minute, lim.tpm));
  if (lim.tpd) c.appendChild(bar('tokens today', p.tokens_day, lim.tpd));
  var kv = el('div', 'kv');
  var t = p.ttft_ms || {};
  [['tokens in', fmtN(p.tokens_in_today)], ['tokens out', fmtN(p.tokens_out_today)],
   ['ttft median', fmtMs(t.median)], ['ttft p95', fmtMs(t.p95)], ['limit scope', lim.scope || '-']
  ].forEach(function (x) {
    var s = el('span', null, x[0] + ' ');
    add(s, el('b', null, x[1]));
    kv.appendChild(s);
  });
  c.appendChild(kv);
  if ((p.disabled_keys || []).length) c.appendChild(el('div', 'note', 'disabled keys: ' + p.disabled_keys.join(', ')));
  if ((p.missing_models || []).length) c.appendChild(el('div', 'note', 'missing models: ' + p.missing_models.join(', ')));
  (p.cooldowns || []).forEach(function (k) {
    var d = el('div', 'note', k.scope + ' cooldown' + (k.model ? ' ' + k.model : '') + (k.key ? ' ' + k.key : '') + ' ');
    if (typeof k._until === 'number') d.appendChild(cd(k._until));
    c.appendChild(d);
  });
  if (p.last_error) c.appendChild(el('div', 'err', 'last error: ' + lastErr(p.last_error)));
  var btns = el('div', 'btns');
  var pause = el('button', null, p.state === 'paused' ? 'Resume' : 'Pause');
  pause.onclick = function () {
    admin('/admin/provider/' + encodeURIComponent(p.id) + (p.state === 'paused' ? '/resume' : '/pause'));
  };
  var clear = el('button', null, 'Clear cooldown');
  clear.onclick = function () { admin('/admin/cooldowns/clear?provider=' + encodeURIComponent(p.id)); };
  var n = (p.models || []).length;
  var tog = el('button', null, (expanded[p.id] ? 'Hide' : 'Show') + ' models (' + n + ')');
  tog.onclick = function () { expanded[p.id] = !expanded[p.id]; renderProviders(); };
  add(btns, pause, clear, tog);
  c.appendChild(btns);
  if (expanded[p.id] && n) {
    var tb = el('table', 'models');
    var hr = el('tr');
    ['model', 'state', 'req today', 'in', 'out', 'last error'].forEach(function (h, i) {
      hr.appendChild(el('th', i > 1 && i < 5 ? 'num' : null, h));
    });
    tb.appendChild(hr);
    p.models.forEach(function (m) {
      var r = el('tr');
      var st = el('td');
      st.appendChild(stateEl(m.state, m._until));
      add(r, el('td', null, m.model), st, el('td', 'num', fmtN(m.requests_today)),
        el('td', 'num', fmtN(m.tokens_in_today)), el('td', 'num', fmtN(m.tokens_out_today)),
        el('td', 'dim', m.last_error ? lastErr(m.last_error) : ''));
      tb.appendChild(r);
    });
    c.appendChild(tb);
  }
  return c;
}
function renderProviders() {
  var box = $('providers');
  box.textContent = '';
  if (!S) return;
  S.providers.forEach(function (p) { box.appendChild(card(p)); });
}
function renderSummary() {
  if (!S) return;
  $('s-req').textContent = fmtN(S.requests_today);
  $('s-in').textContent = fmtN(S.tokens_in_today);
  $('s-out').textContent = fmtN(S.tokens_out_today);
  $('s-streams').textContent = String(S.active_streams);
  var pd = S.paid || {};
  $('s-paid').textContent = fmtUsd(pd.spend_usd) + ' / ' + fmtUsd(pd.cap_usd);
  $('s-up').textContent = fmtDur(S.uptime_secs + (performance.now() - statusAt) / 1000);
}
function chip(cls, text) { return el('span', 'chip ' + cls, text); }
function renderLive() {
  var box = $('live');
  box.textContent = '';
  var inflight = recent.filter(function (r) { return r.in_flight; });
  var done = recent.filter(function (r) { return !r.in_flight; }).slice(0, 50);
  var rows = inflight.concat(done);
  if (!rows.length) {
    var none = el('div', 'dim', 'No requests yet.');
    none.style.padding = '10px';
    box.appendChild(none);
    return;
  }
  var tb = el('table');
  var hr = el('tr');
  ['time', 'model', 'route attempts', 'ttft', 'tokens in/out', 'duration', 'status'].forEach(function (h, i) {
    hr.appendChild(el('th', i > 2 && i < 6 ? 'num' : null, h));
  });
  tb.appendChild(hr);
  rows.forEach(function (r) {
    var tr = el('tr', r.in_flight ? 'inflight' : '');
    var m = el('td');
    if (r.in_flight) m.appendChild(el('span', 'dot'));
    m.appendChild(document.createTextNode(r.model));
    var chain = el('td');
    r.attempts.forEach(function (a) {
      var ok = a.outcome === 'ok';
      chain.appendChild(chip(ok ? 'ok' : 'fail',
        a.provider + '/' + a.model + (ok ? '' : ' ' + a.outcome) + ' ' + fmtMs(a.ms)));
    });
    if (r.in_flight) chain.appendChild(chip('pending', 'trying...'));
    else if (!r.attempts.length) chain.appendChild(el('span', 'dim', r.error || '-'));
    var status = r.in_flight ? 'in flight' : String(r.status === null || r.status === undefined ? '-' : r.status);
    if (!r.in_flight && r.error) status += ' ' + r.error;
    add(tr, el('td', null, fmtClock(r.time_ms)), m, chain,
      el('td', 'num', fmtMs(r.ttft_ms)),
      el('td', 'num', r.in_flight ? '-' : fmtN(r.tokens_in) + ' / ' + fmtN(r.tokens_out)),
      el('td', 'num', fmtMs(r.duration_ms)), el('td', null, status));
    tb.appendChild(tr);
  });
  box.appendChild(tb);
}
function renderChart() {
  var box = $('chart'), lg = $('legend');
  box.textContent = '';
  lg.textContent = '';
  if (!S) return;
  var W = 960, H = 230, L = 46, B = 22, T = 8;
  box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '"></svg>';   // static markup, no data
  var svg = box.firstChild, ns = svg.namespaceURI;
  function mk(tag, attrs, text, parent) {
    var e = document.createElementNS(ns, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }
  var hours = null;
  var series = S.providers.map(function (p, i) {
    var h = p.hourly || [];
    if (!hours && h.length) hours = h.map(function (x) { return x.hour; });
    return {
      id: p.id, color: colors[i % colors.length],
      v: h.map(function (x) { return (x.tokens_in || 0) + (x.tokens_out || 0); })
    };
  });
  var n = hours ? hours.length : 24;
  var max = 0;
  for (var i = 0; i < n; i++) {
    var t = 0;
    series.forEach(function (s) { t += s.v[i] || 0; });
    if (t > max) max = t;
  }
  var ph = H - T - B, bw = (W - L) / n;
  for (var g = 0; g <= 4; g++) {
    var y = T + ph - ph * g / 4;
    mk('line', { x1: L, x2: W, y1: y, y2: y, stroke: '#2a323c', 'stroke-width': 1 });
    mk('text', { x: L - 6, y: y + 4, 'text-anchor': 'end', fill: '#8a95a3', 'font-size': 11 }, fmtN(max * g / 4));
  }
  for (var j = 0; j < n; j++) {
    var base = T + ph;
    series.forEach(function (s) {
      var v = s.v[j] || 0;
      if (!v || !max) return;
      var hh = v / max * ph;
      base -= hh;
      var r = mk('rect', { x: L + j * bw + 2, y: base, width: Math.max(1, bw - 4), height: hh, fill: s.color });
      mk('title', {}, s.id + ': ' + fmtN(v) + ' tokens', r);
    });
    if (hours && j % 3 === 0) {
      mk('text', { x: L + j * bw + bw / 2, y: H - 6, 'text-anchor': 'middle', fill: '#8a95a3', 'font-size': 11 },
        String(new Date(hours[j] * 1000).getHours()).padStart(2, '0') + ':00');
    }
  }
  series.forEach(function (s) {
    var item = el('span');
    var sw = el('i');
    sw.style.background = s.color;
    add(item, sw, document.createTextNode(s.id));
    lg.appendChild(item);
  });
}
var renderTimer = null;
function renderLater() {
  if (renderTimer) return;
  renderTimer = setTimeout(function () { renderTimer = null; renderLive(); }, 100);
}

// ---- data ----
function applyStatus(j) {
  var now = performance.now();
  S = j;
  statusAt = now;
  S.providers.forEach(function (p) { stampAll(p, now); });
  recent = (j.recent || []).slice();
  byId = {};
  recent.forEach(function (r) { byId[r.id] = r; });
  renderSummary();
  renderProviders();
  renderLive();
  renderChart();
}
var fetchTimer = null;
function fetchStatus() {
  if (fetchTimer) return;
  fetchTimer = setTimeout(function () {
    fetchTimer = null;
    fetch('/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(applyStatus)
      .catch(function () {});
  }, 150);
}
function admin(path) {
  fetch(path, { method: 'POST' }).then(function () { fetchStatus(); }).catch(function () {});
}
function newRec(d) {
  var r = {
    id: d.id, time_ms: d.time_ms || Date.now(), model: d.model || '?', stream: !!d.stream, in_flight: true,
    attempts: [], provider: null, upstream_model: null, ttft_ms: null, tokens_in: 0, tokens_out: 0,
    duration_ms: null, status: null, error: null
  };
  byId[r.id] = r;
  recent.unshift(r);
  if (recent.length > 200) delete byId[recent.pop().id];
  return r;
}
function onEvent(type, d) {
  var r = byId[d.id];
  if (type === 'request_start') {
    if (!r) newRec(d);
    renderLater();
  } else if (type === 'attempt') {
    if (r) r.attempts.push({ n: d.n, provider: d.provider, model: d.model, key: d.key, outcome: d.outcome, ms: d.ms });
    renderLater();
  } else if (type === 'first_byte') {
    if (r) r.ttft_ms = d.ttft_ms;
    renderLater();
  } else if (type === 'request_end') {
    if (!r) r = newRec({ id: d.id, time_ms: Date.now() - d.duration_ms });
    r.in_flight = false;
    r.status = d.status;
    r.error = d.error;
    r.provider = d.provider;
    r.upstream_model = d.model;
    r.tokens_in = d.tokens_in;
    r.tokens_out = d.tokens_out;
    r.ttft_ms = d.ttft_ms;
    r.duration_ms = d.duration_ms;
    renderLater();
  } else if (type === 'route_state') {
    fetchStatus();
  } else if (type === 'counters' && S) {
    var now = performance.now();
    var provs = d.providers || [];
    delete d.providers;
    for (var k in d) S[k] = d[k];
    statusAt = now;
    provs.forEach(function (np) {
      S.providers.forEach(function (sp) {
        if (sp.id !== np.id) return;
        for (var f in np) sp[f] = np[f];
        stamp(sp, now);
      });
    });
    renderSummary();
    renderProviders();
  }
}
var es = null, backoff = 500;
function connect() {
  if (es) es.close();
  es = new EventSource('/events');
  ['request_start', 'attempt', 'first_byte', 'request_end', 'route_state', 'counters'].forEach(function (t) {
    es.addEventListener(t, function (ev) {
      var d;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      onEvent(t, d);
    });
  });
  es.onopen = function () {
    backoff = 500;
    $('conn').textContent = 'live';
    fetchStatus();
  };
  es.onerror = function () {
    es.close();
    $('conn').textContent = 'reconnecting...';
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 10000);
  };
}
fetch('/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(applyStatus)
  .catch(function () { $('conn').textContent = 'status unavailable'; })
  .then(connect);
setInterval(tickCountdowns, 1000);
setInterval(fetchStatus, 60000);   // keeps the hourly chart and heavy fields fresh
</script>
</body>
</html>
