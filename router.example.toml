# sluice example configuration. Copy to router.toml and edit.
# Secrets (API keys) never go here: they live in .env (see .env.example).
#
# Every limit below is 0, meaning "unknown, rely on reactive cooldowns".
# Copy real numbers from each provider's dashboard; published free-tier
# numbers go stale. Model ids below are placeholders.

bind = "127.0.0.1:8787"     # non-loopback addresses require ROUTER_API_KEY
state_file = "state.json"
# log_file = "sluice.log"   # also append every request line and warning to this file
max_attempts = 6
first_byte_timeout_secs = 20   # request sent -> first non-comment body data; on expiry fail over (nothing reaches the client before then)
stream_idle_timeout_secs = 60  # silence allowed once the body has started, 0 disables
max_wait_secs = 15          # hold a request this long if a route frees up soon, 0 disables
private_default = false
paid_daily_cap_usd = 1.00   # applies to explicit paid requests, 0 blocks paid entirely
# session_headers = ["x-session-id", "x-opencode-session"]
# sticky_ttl_secs = 7200

# billing: free | credit | paid; unset means paid
[[provider]]
id = "or-free"
base_url = "https://openrouter.ai/api/v1"
keys_env = "OPENROUTER_KEYS"
billing = "free"
usage_cost_field = "cost"
trains_on_input = false     # set per provider after reading its terms
reset_utc_hour = 0
drop_params = []            # request fields this provider rejects
models = [                  # allowlist; omit to allow any model
  "vendor/example-model:free",
]
[provider.limits]
scope = "provider"          # provider | key | key_model
rpm = 0                     # copy real numbers from the provider dashboard, 0 = unknown
rpd = 0
tpm = 0
tpd = 0
[provider.model_limits."vendor/example-model:free"]   # optional per-model override
rpm = 0
# max_input_tokens = 64000  # largest request (sluice's pre-flight estimate) this model accepts, 0 = unknown;
                            # sluice also learns this from "too large" refusals and keeps the lower value

[[provider]]
id = "or-paid"              # paid providers are reachable only by explicit route
base_url = "https://openrouter.ai/api/v1"
keys_env = "OPENROUTER_KEYS"
billing = "paid"
models = ["vendor/example-paid-model"]
[provider.prices."vendor/example-paid-model"]
in_per_mtok = 0.0
out_per_mtok = 0.0

[[provider]]
id = "nvidia"
base_url = "https://integrate.api.nvidia.com/v1"
keys_env = "NVIDIA_KEYS"
billing = "free"

[[provider]]
id = "groq"
base_url = "https://api.groq.com/openai/v1"
keys_env = "GROQ_KEYS"
billing = "free"

[[provider]]
id = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
keys_env = "GEMINI_KEYS"
billing = "free"
trains_on_input = true
reset_utc_hour = 8  # Google resets at midnight Pacific; 8 is safe in both PST and PDT

# Credit provider example (Mistral):
